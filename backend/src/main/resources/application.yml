server:
  port: ${PORT:8080}

spring:
  application:
    name: abhijayflix-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/abhijayflix?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:abhijayflix}
    password: ${DB_PASSWORD:abhijayflix}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway migrations
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

abhijayflix:
  # Comma-separated list of origins allowed to call the API from a browser.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin:
    # Admin endpoints (/api/admin/**) are disabled unless a password is set.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
